      const demoMyId = 'user_me';

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      // Реакция привязанностей при чьей-либо гибели!
      function killPlayerInDemo(m, vic, reason, modalTitle) {
        if (!vic || !vic.alive) return;
        vic.alive = false;
        vic.deathDay = m.day;
        vic.deathReason = reason;

        // Проверяем, был ли кто-то связан с погибшим
        m.players.forEach(other => {
          if (other.alive && other.bondTargetId === vic.id) {
            other.bondKnown = true;
            other.bondRevealed = `Выяснилось, что ${vic.name} был вашим «${other.bondRoleName}»!`;
            other.bondInfo = `ПРАВДА РАСКРЫТА: ${vic.name} был вашим «${other.bondRoleName}» — его гибель потрясла вас!`;
            m.resources.sanity = Math.max(0, m.resources.sanity - 14);
            m.log.unshift(`ТАЙНАЯ СВЯЗЬ РАСКРЫТА: ${other.name} узнал, что погибший ${vic.name} был ему «${other.bondRoleName}»!`);
          }
        });

        if (modalTitle) {
          openDeathModal(m.death = { id: Math.random(),
            title: modalTitle,
            subtitle: `${vic.role.name} • Отсек «${vic.role.deck}»`,
            reason,
            day: m.day
          });
        }
      }

      function setupSecretBonds(players) {
        const indices = shuffle(players.map((_, i) => i));
        for (let i = 0; i + 1 < indices.length; i += 2) {
          const a = players[indices[i]];
          const b = players[indices[i + 1]];
          const tpl = pick(BOND_TEMPLATES);
          // В 80% случаев они ещё не знают о родстве/связи
          const unknown = Math.random() < 0.8;

          a.bondTargetId = b.id;
          a.bondRoleName = tpl.relA;
          a.bondKnown = !unknown;
          a.bondInfo = unknown
            ? tpl.secretForA.replace('{B}', b.name)
            : `Вы знаете, что ${b.name} — ваш близкий человек (${tpl.relA})`;
          a.bondPublicHint = tpl.publicHint.replace('{B}', b.name);
          a.bondRevealed = `Связь с ${b.name}: ${tpl.relA}`;

          b.bondTargetId = a.id;
          b.bondRoleName = tpl.relB;
          b.bondKnown = !unknown;
          b.bondInfo = unknown
            ? tpl.secretForB.replace('{A}', a.name)
            : `Вы знаете, что ${a.name} — ваш близкий человек (${tpl.relB})`;
          b.bondPublicHint = tpl.publicHint.replace('{B}', a.name);
          b.bondRevealed = `Связь с ${a.name}: ${tpl.relB}`;
        }
      }

      function makeEpisode(dayIdx, usedIndices, totalAlive) {
        const avail = EPISODE_SCENARIOS.map((s, i) => ({ s, i })).filter(x => !usedIndices.includes(x.i));
        const chosen = avail.length ? pick(avail) : { s: EPISODE_SCENARIOS[dayIdx % EPISODE_SCENARIOS.length], i: dayIdx % EPISODE_SCENARIOS.length };
        usedIndices.push(chosen.i);
        const voters = Math.max(3, (totalAlive || 10) - 1);
        const anonVotes = [0, 0, 0, 0];
        for (let i = 0; i < voters; i++) {
          anonVotes[Math.floor(Math.random() * 4)] += 1;
        }
        return {
          title: chosen.s.title,
          text: chosen.s.text,
          choices: chosen.s.choices.map(c => ({ label: c.label, hint: c.hint })),
          rawChoices: chosen.s.choices,
          anonVotes,
          resolved: false,
          pickedIdx: null,
          outcomeText: ''
        };
      }

      function autoAssignBotRations() {
        if (!demoMeta || demoMeta.phase !== 'day') return;
        let foodLeft = demoMeta.resources.food - Object.values(demoMeta.rationPlan).filter(x => x.food).length;
        let waterLeft = demoMeta.resources.water - Object.values(demoMeta.rationPlan).filter(x => x.water).length;

        const bots = demoMeta.players.filter(p => p.alive).sort((a, b) => b.hunger - a.hunger);
        for (const b of bots) {
          demoMeta.rationPlan[b.id] = demoMeta.rationPlan[b.id] || { food: false, water: false };
          if (!demoMeta.rationPlan[b.id].food && foodLeft > 0 && b.hunger >= 30) {
            demoMeta.rationPlan[b.id].food = true;
            foodLeft--;
          }
          if (!demoMeta.rationPlan[b.id].water && waterLeft > 0 && b.thirst >= 30) {
            demoMeta.rationPlan[b.id].water = true;
            waterLeft--;
          }
        }
      }

      function runBotDayVotes() {
        const alive = demoMeta.players.filter(p => p.alive);
        alive.filter(p => p.isBot).forEach(bot => {
          if (demoVotes[bot.id]) return;
          const suspects = alive.filter(x => x.id !== bot.id && (bot.alignment === 'cannibal' ? x.alignment !== 'cannibal' : true));
          if (!suspects.length) { demoVotes[bot.id] = 'skip'; return; }
          suspects.sort((a, b) => b.suspicion - a.suspicion + (Math.random() * 14 - 7));
          demoVotes[bot.id] = Math.random() < 0.76 ? suspects[0].id : 'skip';
        });
      }

      function runBotNightActions() {
        const alive = demoMeta.players.filter(p => p.alive);
        alive.filter(p => p.isBot).forEach(bot => {
          if (demoNightActions[bot.id]) return;
          if (bot.alignment === 'cannibal') {
            const victims = alive.filter(x => x.alignment !== 'cannibal');
            if (victims.length) {
              demoNightActions[bot.id] = { targetId: pick(victims).id, disguise: pick(['stealth', 'feast', 'frame']) };
            }
          } else {
            const candidates = alive.filter(x => x.id !== bot.id);
            if (candidates.length) {
              demoNightActions[bot.id] = { targetId: pick(candidates).id, disguise: 'stealth' };
            }
          }
        });
      }

      function checkDemoEnding(m) {
        const alive = m.players.filter(p => p.alive);
        const aliveCan = alive.filter(p => p.alignment === 'cannibal');
        const aliveHum = alive.filter(p => p.alignment === 'human');
        if (m.resources.hull <= 0) { m.phase = 'end'; m.endingId = 7; return true; }
        if (alive.length === 0 || (m.resources.food <= 0 && alive.every(p => p.hunger >= 85))) { m.phase = 'end'; m.endingId = 5; return true; }
        if (m.resources.water <= 0 && alive.every(p => p.thirst >= 85)) { m.phase = 'end'; m.endingId = 6; return true; }
        if (m.resources.sanity <= 0) { m.phase = 'end'; m.endingId = 8; return true; }
        if (aliveCan.length === 0 && m.cannibalsKilled > 0) {
          m.phase = 'end';
          if (aliveHum.length <= 2) m.endingId = 9;
          else if (m.innocentExecuted >= 2) m.endingId = 2;
          else if (m.players.some(p => p.alive && p.role.id === 'radioop')) m.endingId = 10;
          else m.endingId = 1;
          return true;
        }
        if (aliveCan.length >= aliveHum.length) {
          m.phase = 'end';
          m.endingId = (m.resources.food <= 1 && alive.length >= 3) ? 4 : 3;
          return true;
        }
        if (m.day >= m.targetDays) {
          m.phase = 'end';
          m.endingId = aliveCan.length > 0 ? 3 : 1;
          return true;
        }
        return false;
      }

      const ARCH = { pragmatist: 'Запасливый (голод и жажда растут медленнее)', observer: 'Внимательный (легче оправдаться при подозрениях)', adventurer: 'Смелый (приносит +1 припас в сюжетных развилках)' };

      function startAdminGame(list, room) {
        const n = list.length;
        const roles = shuffle(ROLES), traits = shuffle(PERSONAL_TRAITS), secrets = shuffle(SECRET_POOL), alibis = shuffle(ALIBI_POOL);
        const cfg = room.cfg || {};
        const targetDays = room.target_days || 6;
        const autoCan = n >= 20 ? 3 : (n >= 11 ? 2 : 1);
        // людоедов не больше трети пассажиров, чтобы у людей оставались шансы
        const cannibalCount = Math.max(1, Math.min(cfg.cannibals > 0 ? cfg.cannibals : autoCan, Math.floor(n / 3)));
        const hasAccomplice = cfg.accomplice === 'on' ? (cannibalCount + 1 <= Math.floor(n / 2))
          : cfg.accomplice === 'off' ? false : (n >= 16 && cannibalCount < 3);
        const supMul = cfg.supplies === 'low' ? 0.75 : (cfg.supplies === 'high' ? 1.6 : 1.1);
        const al = Array(n).fill('human');
        for (let i = 0; i < cannibalCount; i++) al[i] = 'cannibal';
        if (hasAccomplice) al[cannibalCount] = 'accomplice';
        const sa = shuffle(al), usedEp = [];
        const players = list.map((pl, i) => ({
          id: pl.player_id, isBot: false, name: pl.player_name, gender: pl.gender, alive: true, deathReason: null, deathDay: null,
          hunger: 15, thirst: 15, sanity: 95, role: roles[i % roles.length], trait: { ...traits[i % traits.length] },
          secret: secrets[i % secrets.length], alibi: alibis[i % alibis.length], alignment: sa[i],
          suspicion: sa[i] === 'cannibal' ? Math.floor(16 + Math.random() * 8) : Math.floor(12 + Math.random() * 16),
          bondTargetId: null, bondRoleName: '', bondKnown: false, bondInfo: '', archetype: pl.archetype, archLabel: ARCH[pl.archetype] || '',
          bondPublicHint: '', bondRevealed: ''
        }));
        if (cfg.bonds !== false) setupSecretBonds(players);
        demoMeta = {
          code: room.code, title: room.ark_title, phase: 'day', day: 1, targetDays, usedEpisodes: usedEp,
          currentEpisode: makeEpisode(1, usedEp, n),
          resources: { food: Math.max(2, Math.round(n * supMul)), water: Math.max(2, Math.round(n * supMul)), hull: 100, sanity: 95, trust: 75 },
          players, clues: [`День 1: среди ${n} пассажиров скрывается ${cannibalCount === 2 ? 'двое Людоедов' : (cannibalCount === 3 ? 'трое Людоедов' : 'Людоед')}${hasAccomplice ? ' и тайный Сообщник' : ''}.`],
          log: [`День 1 начался. Пассажиров на борту: ${n}.`], rationPlan: {}, privateReports: {}, innocentExecuted: 0, cannibalsKilled: 0, endingId: null, reacts: [], death: null
        };
        demoVotes = {}; demoNightActions = {}; demoSuspectedByMe = {}; demoStolenByMe = {};
        demoMeta.dayMin = cfg.dayMin || 0;
        deadlineAt = demoMeta.dayMin ? Date.now() + demoMeta.dayMin * 60000 : 0;
        SoundFX.playDawn();
        syncDemoState();
      }

      function buildCommon() {
        const m = demoMeta, isEnd = m.phase === 'end';
        return {
          code: m.code, phase: m.phase, day: m.day, targetDays: m.targetDays, title: m.title,
          currentEpisode: m.currentEpisode ? { title: m.currentEpisode.title, text: m.currentEpisode.text, choices: m.currentEpisode.choices, anonVotes: m.currentEpisode.anonVotes, resolved: m.currentEpisode.resolved, pickedIdx: m.currentEpisode.pickedIdx, outcomeText: m.currentEpisode.outcomeText } : null,
          resources: m.resources, clues: m.clues.slice(0, 8), log: m.log.slice(0, 10),
          votedCount: Object.keys(demoVotes).length, nightCount: Object.keys(demoNightActions).length,
          ending: isEnd ? ENDINGS[m.endingId || 1] : null, allEndingsCatalog: isEnd ? Object.values(ENDINGS) : null,
          reactions: m.reacts || [], death: m.death || null, timer: roundTimerInfo ? { label: roundTimerInfo.label } : null,
          dlLeft: (deadlineAt && m.phase === 'day') ? Math.max(0, Math.round((deadlineAt - Date.now()) / 1000)) : null,
          players: m.players.map(p => ({
            id: p.id, name: p.name, gender: p.gender, alive: p.alive, hunger: p.hunger, thirst: p.thirst, sanity: p.sanity, suspicion: p.suspicion,
            trait: p.trait, alibi: p.alibi, bondPublicHint: p.bondKnown ? p.bondRevealed : p.bondPublicHint,
            bondRevealed: (isEnd || p.bondKnown) ? p.bondRevealed : '', deathReason: p.deathReason, deathDay: p.deathDay,
            roleName: p.role.name, synergy: p.role.synergy || '', deck: p.role.deck, item: p.role.item, passive: p.role.passive, flaw: p.role.flaw,
            secret: isEnd ? p.secret : '', ration: m.rationPlan[p.id] || { food: false, water: false },
            alignment: (!p.alive || isEnd) ? p.alignment : 'unknown'
          }))
        };
      }

      function buildPersonal(pid) {
        const m = demoMeta, admin = pid === null, me = admin ? null : m.players.find(p => p.id === pid);
        const al = {};
        m.players.forEach(p => { if (admin || (me && (p.id === me.id || (me.alignment === 'cannibal' && p.alignment === 'cannibal')))) al[p.id] = p.alignment; });
        return {
          host: admin, myVote: demoVotes[pid] || null, nightSubmitted: !!demoNightActions[pid],
          myPrivateReport: m.privateReports[pid] || [], stolen: demoStolenByMe[pid] || {}, sus: demoSuspectedByMe[pid] || {}, al,
          me: me ? { id: me.id, name: me.name, gender: me.gender, alive: me.alive, hunger: me.hunger, thirst: me.thirst, alignment: me.alignment, role: me.role, trait: me.trait, secret: me.secret, bondInfo: me.bondInfo, archLabel: me.archLabel } : null
        };
      }

      function compose(c, p) {
        return { ...c, ...p, isBotDemo: false, players: c.players.map(x => ({ ...x, alignment: (p.al && p.al[x.id]) || x.alignment, mySuspected: !!(p.sus && p.sus[x.id]) })) };
      }

      function publishSoon() {
        clearTimeout(sendT);
        sendT = setTimeout(() => {
          if (!demoMeta || !lobbyData) return;
          const views = { '*': buildCommon() };
          lobbyData.players.filter(p => !p.is_host).forEach(p => { views[p.player_id] = buildPersonal(p.player_id); });
          call('views', { views }).catch(() => {});
          try { call('snap', { s: window.snapshotHostState() }).catch(() => {}); } catch (e) {}
        }, 200);
      }

      function syncDemoState() {
        if (!demoMeta) return;
        S = compose(buildCommon(), buildPersonal(null));
        onNewS();
        render();
        publishSoon();
      }

      function executeEndDay() {
        if (!demoMeta) return;
        autoAssignBotRations();
        runBotDayVotes();

        const tally = {};
        let skipCnt = 0;
        demoMeta.players.filter(p => p.alive).forEach(p => {
          const v = demoVotes[p.id];
          const w = p.role.id === 'captain' ? 2 : 1;
          if (!v || v === 'skip') skipCnt += w;
          else tally[v] = (tally[v] || 0) + w;
        });

        let topId = null, topV = 0, tie = false;
        Object.entries(tally).forEach(([id, c]) => {
          if (c > topV) { topV = c; topId = id; tie = false; }
          else if (c === topV && c > 0) tie = true;
        });

        const events = [];
        let executedVic = null;
        if (topId && topV > skipCnt && !tie) {
          const vic = demoMeta.players.find(p => p.id === topId);
          if (vic && vic.alive) {
            executedVic = vic;
            if (vic.alignment === 'cannibal') {
              demoMeta.cannibalsKilled += 1;
              demoMeta.resources.sanity = Math.min(100, demoMeta.resources.sanity + 16);
              events.push(`РАЗВЯЗКА ДНЯ: Казнён ${vic.name} — это был настоящий Людоед!`);
              killPlayerInDemo(demoMeta, vic, 'Казнён по приговору суда как Людоед!', `ПРИГОВОР ДНЯ: ${vic.name}`);
            } else {
              demoMeta.innocentExecuted += 1;
              demoMeta.resources.sanity = Math.max(0, demoMeta.resources.sanity - 13);
              events.push(`ТРАГЕДИЯ ДНЯ: Казнён невиновный ${vic.name} (${vic.role.name}).`);
              killPlayerInDemo(demoMeta, vic, 'Ошибочно казнён на дневном суде', `ПРИГОВОР ДНЯ: ${vic.name}`);
            }
          }
        } else {
          events.push('Дневной суд завершился без казни.');
        }

        demoMeta.players.filter(p => p.alive).forEach(p => {
          const pl = demoMeta.rationPlan[p.id] || {};
          const hGain = p.archetype === 'pragmatist' ? 14 : 22;
          const tGain = p.archetype === 'pragmatist' ? 16 : 26;
          if (pl.food && demoMeta.resources.food > 0) { demoMeta.resources.food--; p.hunger = Math.max(0, p.hunger - 45); }
          else p.hunger += hGain;
          if (pl.water && demoMeta.resources.water > 0) { demoMeta.resources.water--; p.thirst = Math.max(0, p.thirst - 50); }
          else p.thirst += tGain;

          const aliveRoleIds = new Set(demoMeta.players.filter(x => x.alive).map(x => x.role.id));
          if (p.role.id === 'chef') {
            const bonus = (aliveRoleIds.has('cook_mate') || aliveRoleIds.has('baker')) ? 3 : 2;
            demoMeta.resources.food += bonus;
          }
          if (p.role.id === 'cook_mate' && aliveRoleIds.has('chef')) p.hunger = Math.max(0, p.hunger - 12);
          if (p.role.id === 'baker' && aliveRoleIds.has('chef')) demoMeta.resources.sanity = Math.min(100, demoMeta.resources.sanity + 5);
          if (p.role.id === 'hydrologist') {
            const bonusW = (aliveRoleIds.has('plumber') || aliveRoleIds.has('tinker')) ? 3 : 2;
            demoMeta.resources.water += bonusW;
          }
          if (p.role.id === 'plumber' && aliveRoleIds.has('hydrologist')) p.thirst = Math.max(0, p.thirst - 12);
          if (p.role.id === 'engineer') {
            const bonusH = (aliveRoleIds.has('welder') || aliveRoleIds.has('carpenter')) ? 11 : 7;
            demoMeta.resources.hull = Math.min(100, demoMeta.resources.hull + bonusH);
          }
          if (p.role.id === 'psychologist' && (aliveRoleIds.has('chaplain') || aliveRoleIds.has('herbalist'))) {
            demoMeta.resources.sanity = Math.min(100, demoMeta.resources.sanity + 6);
          }
        });

        demoMeta.resources.hull = Math.max(0, demoMeta.resources.hull - 6);
        demoMeta.resources.sanity = Math.max(0, demoMeta.resources.sanity - 5);
        demoMeta.rationPlan = {};
        demoVotes = {};
        demoMeta.log.unshift(...events);

        if (!checkDemoEnding(demoMeta)) {
          demoMeta.phase = 'night';
          SoundFX.playNightFall();
        } else {
          SoundFX.playTwist();
        }
        syncDemoState();
      }

      function executeResolveNight() {
        if (!demoMeta) return;
        runBotNightActions();
        demoMeta.privateReports = {};

        const me = demoMeta.players.find(p => p.id === demoMyId);
        const myAct = demoNightActions[demoMyId];
        const protectedIds = new Set();

        demoMeta.players.filter(p => p.alive).forEach(p => {
          const a = demoNightActions[p.id];
          if (a?.targetId && (p.role.id === 'guard' || p.role.id === 'surgeon')) {
            protectedIds.add(a.targetId);
          }
        });

        const roleNightLogs = [];
        const roleNightClues = [];

        demoMeta.players.filter(p => p.alive).forEach(p => {
          const a = demoNightActions[p.id];
          const t = a?.targetId ? demoMeta.players.find(x => x.id === a.targetId) : null;
          const rid = p.role.id;

          if (rid === 'detective' && t) {
            const rep = `Ночное наблюдение за ${t.name} (${t.role.name}): ${t.alignment === 'cannibal' ? 'ОБНАРУЖЕНЫ НЕОПРОВЕРЖИМЫЕ УЛИКИ ЛЮДОЕДА!' : `замечен в отсеке «${t.role.deck}», прямых улик каннибализма нет.`}`;
            demoMeta.privateReports[p.id] = demoMeta.privateReports[p.id] || [];
            demoMeta.privateReports[p.id].push(rep);
          } else if (rid === 'chemist' && t) {
            const rep = `Анализ проб ${t.name}: ${t.alignment === 'cannibal' ? 'реактивы выявили следы хищника!' : 'пробы чисты, признаков каннибализма не найдено.'}`;
            demoMeta.privateReports[p.id] = demoMeta.privateReports[p.id] || [];
            demoMeta.privateReports[p.id].push(rep);
          } else if (rid === 'archivist' && t) {
            const rep = `Архив по ${t.name} (${t.role.name}): отсек «${t.role.deck}», зацепка — «${t.alibi || 'сведений мало'}».`;
            demoMeta.privateReports[p.id] = demoMeta.privateReports[p.id] || [];
            demoMeta.privateReports[p.id].push(rep);
          } else if ((rid === 'hydrologist' || rid === 'plumber' || rid === 'tinker') && t && t.alive) {
            t.thirst = Math.max(0, t.thirst - 30);
            if (rid === 'hydrologist') demoMeta.resources.water += 1;
            demoMeta.privateReports[p.id] = demoMeta.privateReports[p.id] || [];
            demoMeta.privateReports[p.id].push(`Ночью вы напоили и проверили баки для ${t.name} (жажда −30%).`);
          } else if ((rid === 'chef' || rid === 'cook_mate' || rid === 'baker' || rid === 'sommelier') && t && t.alive) {
            t.hunger = Math.max(0, t.hunger - 30);
            if (rid === 'baker') demoMeta.resources.sanity = Math.min(100, demoMeta.resources.sanity + 4);
            demoMeta.privateReports[p.id] = demoMeta.privateReports[p.id] || [];
            demoMeta.privateReports[p.id].push(`Ночью вы передали горячий паёк для ${t.name} (голод −30%).`);
          } else if ((rid === 'psychologist' || rid === 'chaplain' || rid === 'herbalist' || rid === 'candlemaker') && t && t.alive) {
            t.sanity = Math.min(100, t.sanity + 20);
            demoMeta.resources.sanity = Math.min(100, demoMeta.resources.sanity + 6);
            demoMeta.privateReports[p.id] = demoMeta.privateReports[p.id] || [];
            demoMeta.privateReports[p.id].push(`Ночью вы поддержали ${t.name} и помогли экипажу сохранить рассудок (+6%).`);
          } else if ((rid === 'engineer' || rid === 'welder' || rid === 'carpenter' || rid === 'stoker' || rid === 'boilermaker' || rid === 'electrician')) {
            const gainH = (rid === 'engineer' || rid === 'welder') ? 9 : 6;
            demoMeta.resources.hull = Math.min(100, demoMeta.resources.hull + gainH);
            demoMeta.privateReports[p.id] = demoMeta.privateReports[p.id] || [];
            demoMeta.privateReports[p.id].push(`Ночная работа в отсеках укрепила корпус Ковчега (+${gainH}%).`);
          } else if ((rid === 'radioop' || rid === 'sonar_op' || rid === 'meteorologist' || rid === 'navigator' || rid === 'lookout' || rid === 'cartographer' || rid === 'beacon_op')) {
            const canHint = demoMeta.players.find(x => x.alive && x.alignment === 'cannibal');
            if (canHint) {
              demoMeta.privateReports[p.id] = demoMeta.privateReports[p.id] || [];
              demoMeta.privateReports[p.id].push(`Ночной дозор/приборы зафиксировали активность у отсека «${canHint.role.deck}» (${canHint.role.clueTag}).`);
            }
          } else if ((rid === 'butcher' || rid === 'botanist' || rid === 'orchardist' || rid === 'fisher' || rid === 'smuggler' || rid === 'quartermaster' || rid === 'auditor')) {
            if (Math.random() < 0.55) demoMeta.resources.food += 1;
            else demoMeta.resources.water += 1;
            demoMeta.privateReports[p.id] = demoMeta.privateReports[p.id] || [];
            demoMeta.privateReports[p.id].push(`Ночной обход запасов помог сберечь или раздобыть припасы для Ковчега.`);
          } else if ((rid === 'warden' || rid === 'lifeguard' || rid === 'ferryman' || rid === 'locksmith' || rid === 'rigger' || rid === 'chronicler' || rid === 'sailor_vet') && t && t.alive) {
            protectedIds.add(t.id);
            demoMeta.privateReports[p.id] = demoMeta.privateReports[p.id] || [];
            demoMeta.privateReports[p.id].push(`Ночью вы прикрывали ${t.name} и следили за порядком в коридорах.`);
          }
        });

        const alive = demoMeta.players.filter(p => p.alive);
        const cannibals = alive.filter(p => p.alignment === 'cannibal');
        const news = [...roleNightLogs];
        const clues = [...roleNightClues];
        let lastNightVictim = null;

        cannibals.forEach(can => {
          const actObj = demoNightActions[can.id];
          const vic = alive.find(x => x.id === actObj?.targetId && x.alignment !== 'cannibal') || pick(alive.filter(x => x.alignment !== 'cannibal'));
          if (vic) {
            const cid = can.role.id;
            const victimWasHungry = (vic.hunger ?? 0) >= 50;

            if (protectedIds.has(vic.id)) {
              news.push(`НОЧНАЯ СХВАТКА: Людоед пытался напасть на ${vic.name}, но охрана/дозор отбили атаку!`);
              clues.push(`След схватки (День ${demoMeta.day}): у двери ${vic.name} осталось — ${can.role.clueTag}.`);
              can.suspicion += (cid === 'cannibal_shadow' || cid === 'cannibal_doctor') ? 11 : 18;
            } else {
              lastNightVictim = vic;
              const baseSanLoss = cid === 'flesh_stalker' ? 14 : (cid === 'cannibal_whisper' ? 13 : 10);
              demoMeta.resources.sanity = Math.max(0, demoMeta.resources.sanity - baseSanLoss);

              if (cid === 'cannibal_scavenger' && victimWasHungry) {
                demoMeta.resources.food += 1;
                can.suspicion = Math.max(0, can.suspicion - 5);
                news.push(`ПАССИВКА ПАДАЛЬЩИКА: Ослабевшая от голода жертва ${vic.name} принесла +1 еды и меньше выдала хищника.`);
              }
              if (cid === 'cannibal_mimic') {
                const donorHuman = pick(alive.filter(x => x.alive && x.alignment === 'human' && x.id !== vic.id));
                if (donorHuman && donorHuman.alibi) {
                  can.alibi = `Перенятое алиби: «${donorHuman.alibi}»`;
                  news.push(`ПАССИВКА ДВОЙНИКА: Хищник перенял чужое алиби на следующий день.`);
                }
              }

              const isMeatRole = ['meat_cleaver', 'cannibal_chef', 'cannibal_scavenger'].includes(cid);
              const isMimicRole = ['mimic_hunter', 'cannibal_mimic', 'cannibal_whisper'].includes(cid);
              const isStealthRole = ['flesh_stalker', 'cannibal_shadow', 'cannibal_doctor'].includes(cid);
              const isTideRole = ['cannibal_tide'].includes(cid);
              const isFurnaceRole = ['cannibal_furnace', 'shadow_saboteur'].includes(cid);

              if (actObj?.disguise === 'feast') {
                const foodGain = (isMeatRole || cid === 'cannibal_chef' || cid === 'meat_cleaver') ? 3 : 2;
                demoMeta.resources.food += foodGain;
                can.suspicion += (cid === 'cannibal_chef' || cid === 'meat_cleaver') ? 14 : (isMeatRole ? 16 : 22);
                news.push(`КОШМАР В КАМБУЗЕ: Утром нашли останки ${vic.name} (${vic.role.name}), а в котле прибавилось мяса (+${foodGain} еды)...`);
                clues.push(`Яркая улика (День ${demoMeta.day}): у котла замечено — ${can.role.clueTag}.`);
              } else if (actObj?.disguise === 'frame') {
                const frameTarget = pick(alive.filter(x => x.alive && x.alignment === 'human')) || can;
                const frameGain = cid === 'cannibal_mimic' ? 32 : (isMimicRole ? 28 : 20);
                frameTarget.suspicion += frameGain;
                news.push(`НОЧНАЯ ТРАГЕДИЯ: ${vic.name} (${vic.role.name}) убит! Рядом нашли личную вещь ${frameTarget.name}...`);
                clues.push(`Запутанная улика (День ${demoMeta.day}): кто-то подбросил вещь ${frameTarget.name}, но запах выдаёт — ${can.role.clueTag}.`);
              } else if (actObj?.disguise === 'overboard') {
                const dropSusp = cid === 'cannibal_tide' ? 15 : (isTideRole ? 12 : 6);
                can.suspicion = Math.max(0, can.suspicion - dropSusp);
                news.push(`ПРОПАЖА У БОРТА: Ночью ${vic.name} (${vic.role.name}) исчез у палубы — волны смыли почти все следы.`);
                clues.push(`Слабый след у борта (День ${demoMeta.day}): прибой оставил — ${can.role.clueTag}.`);
              } else if (actObj?.disguise === 'hallway_ambush') {
                const sanLoss = isMimicRole ? 16 : 12;
                demoMeta.resources.sanity = Math.max(0, demoMeta.resources.sanity - sanLoss);
                can.suspicion += (cid === 'cannibal_doctor' || cid === 'cannibal_shadow') ? 7 : (isStealthRole ? 10 : 15);
                news.push(`ЗАСАДА В КОРИДОРЕ: В темноте отсека «${vic.role.deck}» оборвалась жизнь ${vic.name} (${vic.role.name}) — экипаж в ужасе.`);
                clues.push(`След засады (День ${demoMeta.day}): в коридоре обнаружено — ${can.role.clueTag}.`);
              } else if (actObj?.disguise === 'furnace_ash') {
                const ashDrop = cid === 'cannibal_furnace' ? 19 : (isFurnaceRole ? 16 : 10);
                can.suspicion = Math.max(0, can.suspicion - ashDrop);
                news.push(`ПЕПЕЛ В ТОПКЕ: Ночью ${vic.name} (${vic.role.name}) погиб; часть улик сгорела в печи, но запах выдаёт хищника.`);
                clues.push(`След у печи (День ${demoMeta.day}): в золе угадывается — ${can.role.clueTag}.`);
              } else if (actObj?.disguise === 'sound_mask') {
                const maskDrop = cid === 'shadow_saboteur' ? 16 : (isFurnaceRole ? 14 : 8);
                can.suspicion = Math.max(0, can.suspicion - maskDrop);
                news.push(`ШУМ ОТСЕКОВ: Под гул турбин и плеск воды ночью погиб ${vic.name} (${vic.role.name}).`);
                clues.push(`Скрытая улика (День ${demoMeta.day}): несмотря на шум, замечено — ${can.role.clueTag}.`);
              } else {
                can.suspicion += (cid === 'cannibal_doctor' || cid === 'cannibal_shadow') ? 3 : (isStealthRole ? 5 : 8);
                news.push(`НОЧЬ: Пассажир ${vic.name} (${vic.role.name}) пал жертвой Людоеда в отсеке «${vic.role.deck}»!`);
                clues.push(`Улика (День ${demoMeta.day}): в отсеке «${vic.role.deck}» обнаружено — ${can.role.clueTag}.`);
              }
              killPlayerInDemo(demoMeta, vic, 'Растерзан Людоедом ночью', `НОЧНАЯ ПОТЕРЯ: ${vic.name}`);
            }
          }
        });

        demoMeta.players.filter(p => p.alive).forEach(p => {
          if (p.hunger >= 100 || p.thirst >= 100) {
            const reason = p.hunger >= 100 ? 'Умер от голода' : 'Умер от жажды';
            if (!lastNightVictim) lastNightVictim = p;
            news.push(`${p.name} не пережил ночь без пайков.`);
            killPlayerInDemo(demoMeta, p, reason, `НОЧНАЯ ПОТЕРЯ: ${p.name}`);
          }
        });

        demoMeta.log.unshift(...news);
        demoMeta.clues.unshift(...clues);
        demoNightActions = {};
        selectedNightTarget = null;

        const aliveAfter = demoMeta.players.filter(p => p.alive).length;
        if (!checkDemoEnding(demoMeta)) {
          demoMeta.day += 1;
          demoMeta.phase = 'day';
          demoMeta.currentEpisode = makeEpisode(demoMeta.day, demoMeta.usedEpisodes, aliveAfter);
          deadlineAt = demoMeta.dayMin ? Date.now() + demoMeta.dayMin * 60000 : 0;
          SoundFX.playDawn();
        } else {
          SoundFX.playTwist();
        }
        syncDemoState();
      }

const _toast = toast;
      function handleAct(act, btn, actor) {
        const remote = actor !== null;
        const quiet = act === 'vote' || act === 'submitNight';
        const toast = remote
          ? (msg) => { if (quiet) return; const R = demoMeta.privateReports; (R[actor] = R[actor] || []).unshift(msg); }
          : _toast;
        const SUS = () => demoSuspectedByMe[actor] || (demoSuspectedByMe[actor] = {});
        if (act === 'episodeChoice') {
          const idx = Number(btn.dataset.idx);
          const ep = demoMeta.currentEpisode;
          if (!ep || ep.resolved || !ep.rawChoices[idx]) return;
          SoundFX.playTwist();
          ep.resolved = true;
          ep.pickedIdx = idx;
          ep.anonVotes = ep.anonVotes || [0, 0, 0, 0];
          ep.anonVotes[idx] += 1;
          ep.outcomeText = ep.rawChoices[idx].apply(demoMeta);
          const mePlayer = demoMeta.players.find(p => p.id === actor);
          if (mePlayer && mePlayer.alive && mePlayer.archetype === 'adventurer') {
            demoMeta.resources.food += 1;
            ep.outcomeText += ' Смелый характер помог раздобыть +1 еду!';
          }
          demoMeta.log.unshift(`СЮЖЕТ (${ep.title}): ${ep.outcomeText}`);
          syncDemoState();
          return;
        }

        if (act === 'botAutoRation') {
          SoundFX.playRation('food');
          autoAssignBotRations();
          toast('Боты разобрали остатки пайков');
          syncDemoState();
          return;
        }

        if (act === 'ration') {
          const tid = btn.dataset.id;
          const kind = btn.dataset.kind;
          demoMeta.rationPlan[tid] = demoMeta.rationPlan[tid] || { food: false, water: false };
          const used = Object.values(demoMeta.rationPlan).filter(x => x[kind]).length;
          if (!demoMeta.rationPlan[tid][kind]) {
            if (used >= demoMeta.resources[kind]) { toast('Не хватает запасов!'); return; }
            demoMeta.rationPlan[tid][kind] = true;
          } else {
            demoMeta.rationPlan[tid][kind] = false;
          }
          SoundFX.playRation(kind);
          syncDemoState();
          return;
        }

        if (act === 'suspect') {
          const tid = btn.dataset.id;
          const target = demoMeta.players.find(p => p.id === tid && p.alive);
          if (target) {
            const delta = target.archetype === 'observer' ? 6 : 12;
            if (!SUS()[tid]) {
              SUS()[tid] = delta;
              target.suspicion = Math.min(100, (target.suspicion ?? 20) + delta);
              SoundFX.playClick();
              toast(target.archetype === 'observer'
                ? `Внимательный ${target.name} ловко отбился — подозрение +${delta}% (${target.suspicion}%)`
                : `Подозрение к ${target.name} выросло до ${target.suspicion}%`);
            } else {
              const prevDelta = SUS()[tid];
              delete SUS()[tid];
              target.suspicion = Math.max(0, (target.suspicion ?? 20) - prevDelta);
              SoundFX.playClick();
              toast(`Подозрение с ${target.name} снято (${target.suspicion}%)`);
            }
            syncDemoState();
          }
          return;
        }

        if (act === 'vote') {
          SoundFX.playStamp();
          demoVotes[actor] = btn.dataset.id;
          toast('Ваш голос зафиксирован');
          syncDemoState();
          return;
        }

        if (act === 'endDay') {
          SoundFX.playStamp();
          startRoundTimer('Завершение дня и наступление ночи', 3, executeEndDay);
          return;
        }

        if (act === 'setMode') {
          SoundFX.playClick();
          selectedCannibalMode = btn.dataset.mode;
          render();
          return;
        }

        if (act === 'pickNight') {
          SoundFX.playClick();
          selectedNightTarget = btn.dataset.id;
          render();
          return;
        }

        if (act === 'submitNight') {
          SoundFX.playStamp();
          demoNightActions[actor] = { targetId: btn.dataset.target || selectedNightTarget, disguise: btn.dataset.mode || selectedCannibalMode };
          toast('Ваш ночной ход зафиксирован');
          syncDemoState();
          return;
        }

        if (act === 'resolveNight') {
          SoundFX.playDawn();
          startRoundTimer(`Рассвет и старт Серии ${demoMeta.day + 1}`, 3, executeResolveNight);
          return;
        }

        if (act === 'stealResource') {
          const kind = btn.dataset.kind;
          const mePlayer = demoMeta.players.find(p => p.id === actor && p.alive);
          if (!mePlayer) return;
          const stolenMap = demoStolenByMe[actor] || (demoStolenByMe[actor] = {});
          const key = demoMeta.day + '_' + kind;
          if (stolenMap[key]) {
            toast('Сегодня вы уже совершали такую кражу!');
            return;
          }
          const isFood = kind === 'food';
          const canSteal = isFood
            ? ((mePlayer.hunger ?? 0) >= 65 || (demoMeta.resources.food ?? 0) <= 1)
            : ((mePlayer.thirst ?? 0) >= 65 || (demoMeta.resources.water ?? 0) <= 1);
          if (!canSteal) {
            toast('Хватает сил и припасов — кража не требуется');
            return;
          }

          stolenMap[key] = true;
          const caught = Math.random() < 0.38;
          const fromPool = (demoMeta.resources[kind] ?? 0) > 0;

          if (fromPool) {
            demoMeta.resources[kind] = Math.max(0, demoMeta.resources[kind] - 1);
            if (isFood) mePlayer.hunger = Math.max(0, mePlayer.hunger - 45);
            else mePlayer.thirst = Math.max(0, mePlayer.thirst - 50);

            if (caught) {
              mePlayer.suspicion = Math.min(100, (mePlayer.suspicion ?? 20) + 18);
              demoMeta.resources.trust = Math.max(0, (demoMeta.resources.trust ?? 70) - 8);
              demoMeta.clues.unshift(`Кража припасов (День ${demoMeta.day}): кто-то тайком стащил ${isFood ? 'суп' : 'воду'} из общего запаса!`);
              void(`Вас заметили при краже ${isFood ? 'супа' : 'воды'} из запаса (+18% подозрения).`);
              toast(`Вы стащили ${isFood ? 'суп' : 'воду'}, но вас заметили (+18% подозрения)!`);
            } else {
              void(`Вы незаметно раздобыли порцию ${isFood ? 'супа' : 'воды'} из общего запаса.`);
              toast(`Удалось незаметно раздобыть ${isFood ? 'суп' : 'воду'}!`);
            }
          } else {
            const others = demoMeta.players.filter(p => p.alive && p.id !== actor);
            const donor = others.length ? others[Math.floor(Math.random() * others.length)] : null;
            if (isFood) mePlayer.hunger = Math.max(0, mePlayer.hunger - 35);
            else mePlayer.thirst = Math.max(0, mePlayer.thirst - 40);

            if (donor) {
              if (isFood) donor.hunger = Math.min(100, donor.hunger + 18);
              else donor.thirst = Math.min(100, donor.thirst + 20);
            }
            if (caught) {
              mePlayer.suspicion = Math.min(100, (mePlayer.suspicion ?? 20) + 22);
              demoMeta.resources.trust = Math.max(0, (demoMeta.resources.trust ?? 70) - 10);
              demoMeta.clues.unshift(`Подозрительная пропажа (День ${demoMeta.day}): у ${donor ? donor.name : 'пассажира'} пропал ${isFood ? 'суп' : 'глоток воды'}!`);
              toast(`Вы забрали ${isFood ? 'суп' : 'воду'} у ${donor ? donor.name : 'соседа'}, но вас спалили (+22% подозрения)!`);
            } else {
              void(`В отчаянии вы стащили ${isFood ? 'суп' : 'воду'} у ${donor ? donor.name : 'соседа'}.`);
              toast(`Вы украли ${isFood ? 'суп' : 'воду'} у ${donor ? donor.name : 'соседа'}!`);
            }
          }
          SoundFX.playRation(kind);
          syncDemoState();
          return;
        }

        if (act === 'react') {
          const emoji = btn.dataset.emoji;
          if (!['😱', '🔪', '🍖', '🕵️', '🔥', '💀'].includes(emoji)) return;
          const rc = (demoMeta.reacts = demoMeta.reacts || []);
          rc.push({ i: (rc.length ? rc[rc.length - 1].i : 0) + 1, e: emoji, f: actor });
          if (rc.length > 12) rc.shift();
          syncDemoState();
          return;
        }
      }

      function applyRemote(m) {
        if (!demoMeta || demoMeta.phase === 'end') return;
        const a = demoMeta.players.find(p => p.id === m.from);
        if (!a) return;
        if (m.act === 'react') { handleAct('react', { dataset: m.d || {} }, m.from); return; }
        if (!a.alive) return;
        const day = demoMeta.phase === 'day', night = demoMeta.phase === 'night';
        if (['vote', 'suspect', 'stealResource'].includes(m.act) && day) handleAct(m.act, { dataset: m.d || {} }, m.from);
        else if (m.act === 'submitNight' && night) handleAct(m.act, { dataset: m.d || {} }, m.from);
      }

      document.addEventListener('change', e => { if (e.target && e.target.matches && e.target.matches('[data-cfg]') && ses && ses.admin) saveCfg(); });

      document.addEventListener('click', e => {
        const btn = e.target.closest('[data-act]');
        if (!btn || btn.disabled) return;
        const act = btn.dataset.act;
        const lobbyNow = ses && !ses.admin && lobbyData && lobbyData.room.status === 'waiting';

        if (act === 'pickGender') { SoundFX.playClick(); chosenGender = btn.dataset.g === 'female' ? 'female' : 'male'; if (lobbyNow) call('upd', { gender: chosenGender }).then(poll).catch(() => {}); else render(); return; }
        if (act === 'pickArch') { SoundFX.playClick(); chosenArchetype = btn.dataset.a; if (lobbyNow) call('upd', { archetype: chosenArchetype }).then(poll).catch(() => {}); else render(); return; }
        if (act === 'closeDeathModal') { closeDeathModal(); return; }
        if (act === 'skipTimer') { skipRoundTimer(); return; }
        if (act === 'toggleSound') { const muted = SoundFX.toggleMute(); toast(muted ? 'Звук выключен' : 'Атмосферный звук включён'); render(); return; }
        if (act === 'create') { createRoom(); return; }
        if (act === 'join') { joinRoom(); return; }
        if (act === 'ready') { toggleReady(); return; }
        if (act === 'startGame') { startGameBtn(); return; }
        if (act === 'leave') { SoundFX.playClick(); leaveAll(); return; }
        if (act === 'kick') { if (confirm('Убрать этого игрока из комнаты?')) kickPlayer(btn.dataset.id); return; }
        if (act === 'setMode') { SoundFX.playClick(); selectedCannibalMode = btn.dataset.mode; render(); return; }
        if (act === 'pickNight') { SoundFX.playClick(); selectedNightTarget = btn.dataset.id; render(); return; }

        if (ses && ses.admin && demoMeta) {
          if (act === 'setDeadline') { const mn = Number(btn.dataset.min); deadlineAt = mn ? Date.now() + mn * 60000 : 0; syncDemoState(); return; }
          if (['episodeChoice', 'ration', 'endDay', 'resolveNight'].includes(act)) handleAct(act, btn, null);
          return;
        }
        if (ses && !ses.admin && S && ['vote', 'suspect', 'stealResource', 'submitNight', 'react'].includes(act)) {
          const d = { ...btn.dataset };
          if (act === 'submitNight') { d.target = selectedNightTarget; d.mode = selectedCannibalMode; S.nightSubmitted = true; SoundFX.playStamp(); render(); }
          if (act === 'vote') { S.myVote = btn.dataset.id; SoundFX.playStamp(); render(); }
          if (act === 'react') spawnReaction(btn.dataset.emoji);
          if (act === 'suspect' || act === 'stealResource') SoundFX.playClick();
          call('msg', { m: { act, d } }).then(() => { if (act !== 'react') setTimeout(poll, 1500); }).catch(e => toast(e.message));
        }
      });
      // Движок живёт внутри этой функции, а опрос сервера и экраны — снаружи, поэтому выставляем нужное наружу
      window.startAdminGame = startAdminGame;
      window.applyRemote = applyRemote;
      window.compose = compose;
      window.handleAct = handleAct;
      window.publishSoon = publishSoon;
      window.syncDemoState = syncDemoState;
      window.snapshotHostState = function() {
        return JSON.stringify({ m: demoMeta, v: demoVotes, n: demoNightActions, s: demoSuspectedByMe, st: demoStolenByMe, dl: deadlineAt ? Math.max(0, deadlineAt - Date.now()) : 0 });
      };
      window.restoreHostState = function(raw) {
        const o = JSON.parse(raw);
        demoMeta = o.m; demoVotes = o.v || {}; demoNightActions = o.n || {}; demoSuspectedByMe = o.s || {}; demoStolenByMe = o.st || {};
        const ep = demoMeta.currentEpisode;
        if (ep) { const sc = EPISODE_SCENARIOS.find(x => x.title === ep.title); if (sc) ep.rawChoices = sc.choices; }
        deadlineAt = o.dl > 0 ? Date.now() + o.dl : 0;
        syncDemoState();
      };
      render();
    })();
  </script>
</body>
</html>
