<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>КОВЧЕГ: ПОСЛЕДНИЙ РЕЙС — Мультиплеер для группы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=PT+Sans+Narrow:wght@400;700&family=Russo+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #171210;
      --paper: #f2e5c6;
      --paper-dark: #dccba4;
      --card: #fbf3e2;
      --mustard: #e3a329;
      --teal: #347078;
      --orange: #d45522;
      --olive: #5d6b3b;
      --danger: #b82525;
      --blood: #7d1717;
      --indigo: #242938;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #2e241e 0%, #120e0c 100%);
      color: var(--ink);
      font-family: 'PT Sans Narrow', sans-serif;
      font-size: 16px;
    }

    .paper-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.055;
      background-image: radial-gradient(#000 1px, transparent 0), radial-gradient(#3a2818 1px, transparent 0);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 14px 14px 70px;
    }

    .comic-box {
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 10px 18px 12px 16px;
      box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.72);
      padding: 18px;
      margin-bottom: 16px;
      position: relative;
    }

    .comic-btn {
      font-family: 'Russo One', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      background: var(--mustard);
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 6px 12px 5px 10px;
      box-shadow: 3px 3px 0px var(--ink);
      padding: 9px 15px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13.5px;
    }
    .comic-btn:hover:not(:disabled) {
      transform: translate(-1.5px, -1.5px);
      box-shadow: 5px 5px 0px var(--ink);
      background: #efb338;
    }
    .comic-btn:active:not(:disabled) {
      transform: translate(1.5px, 1.5px);
      box-shadow: 1px 1px 0px var(--ink);
    }
    .comic-btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
      filter: grayscale(0.45);
    }
    .comic-btn.orange { background: var(--orange); color: #fff8eb; }
    .comic-btn.teal { background: var(--teal); color: #fff8eb; }
    .comic-btn.olive { background: var(--olive); color: #fff8eb; }
    .comic-btn.danger { background: var(--danger); color: #fff8eb; }
    .comic-btn.paper { background: var(--card); color: var(--ink); }
    .comic-btn.indigo { background: var(--indigo); color: #f2e5c6; }
    .comic-btn.small { padding: 5px 10px; font-size: 12px; }

    .header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 3px dashed var(--ink);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .logo-title {
      font-family: 'Russo One', sans-serif;
      font-size: clamp(22px, 3.4vw, 35px);
      color: var(--orange);
      text-shadow: 2px 2px 0px var(--ink), -1px -1px 0px var(--ink), 1px -1px 0px var(--ink), -1px 1px 0px var(--ink);
      line-height: 1.05;
    }

    .stamp-badge {
      background: var(--ink);
      color: var(--mustard);
      font-family: 'Oswald', sans-serif;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 14px;
      letter-spacing: 1px;
      transform: rotate(-1deg);
      display: inline-block;
    }
    .stamp-badge.blood { background: var(--danger); color: #fff8eb; }
    .stamp-badge.teal { background: var(--teal); color: #fff8eb; }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    @media (max-width: 780px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .field { margin-bottom: 11px; }
    .field label {
      display: block;
      font-family: 'Russo One', sans-serif;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 9px 12px;
      border: 3px solid var(--ink);
      border-radius: 6px;
      background: var(--card);
      color: var(--ink);
      font-family: 'PT Sans Narrow', sans-serif;
      font-size: 16px;
      font-weight: 700;
      outline: none;
    }

    .res-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
      margin-bottom: 14px;
    }
    @media (max-width: 760px) {
      .res-bar { grid-template-columns: repeat(2, 1fr); }
    }
    .res-pill {
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 8px;
      padding: 7px 10px;
      box-shadow: 3px 3px 0px var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .res-pill b { font-family: 'Russo One', sans-serif; font-size: 19px; }
    .res-pill span { font-size: 12.5px; font-weight: 700; text-transform: uppercase; }

    /* Детальный Canvas Ковчега */
    .ark-stage {
      width: 100%;
      border: 4px solid var(--ink);
      border-radius: 12px;
      background: #141a21;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 6px 6px 0px var(--ink);
      position: relative;
    }
    canvas#arkCanvas {
      display: block;
      width: 100%;
      height: 360px;
    }

    /* Сюжетная развилка дня (сериальный эпизод) */
    .episode-card {
      background: linear-gradient(135deg, #fff5d6 0%, #f5dfb0 100%);
      border: 3.5px solid var(--ink);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 5px 5px 0px var(--ink);
    }
    .episode-title {
      font-family: 'Russo One', sans-serif;
      font-size: 17px;
      color: var(--blood);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 9px;
      margin-top: 10px;
    }
    .choice-btn {
      text-align: left;
      background: var(--card);
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      font-family: 'PT Sans Narrow', sans-serif;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 3px 3px 0px var(--ink);
      transition: transform 0.1s, background 0.15s;
    }
    .choice-btn:hover:not(:disabled) {
      background: #ffe69c;
      transform: translate(-1px, -1px);
    }
    .choice-btn.picked {
      background: var(--olive);
      color: #fff;
    }

    /* Личное досье игрока */
    .dossier-card {
      background: #ffe9a8;
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 4px 4px 0px var(--ink);
    }
    .dossier-card.cannibal { background: #f5c2c2; border-color: var(--blood); }
    .dossier-card.accomplice { background: #f5d4b3; }

    /* Карточки участников */
    .crew-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .crew-card {
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 8px 14px 8px 12px;
      box-shadow: 4px 4px 0px var(--ink);
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
    }
    .crew-card.dead { background: #cdc4b2; opacity: 0.74; }
    .crew-card.is-cannibal { border-color: var(--danger); background: #fae0e0; }
    .crew-role-tag {
      display: inline-block;
      background: var(--teal);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1.5px solid var(--ink);
    }
    .secret-pill {
      background: #efe2c4;
      border-left: 3px solid var(--orange);
      padding: 4px 7px;
      font-size: 13px;
      border-radius: 0 4px 4px 0;
    }
    .crew-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: auto;
      padding-top: 7px;
      border-top: 2px dashed rgba(26,20,18,0.25);
    }

    .notebook-list {
      background: #fbf4e4;
      border: 3px solid var(--ink);
      border-radius: 8px;
      padding: 12px;
      background-image: linear-gradient(rgba(74, 108, 128, 0.13) 1px, transparent 1px);
      background-size: 100% 25px;
    }
    .notebook-list li { margin-bottom: 6px; line-height: 1.35; font-weight: 700; }

    .reactions-bar {
      position: fixed;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 99px;
      padding: 6px 10px;
      box-shadow: 4px 4px 0px var(--ink);
      z-index: 50;
    }
    .react-btn {
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fly-emoji {
      position: fixed;
      bottom: 60px;
      font-size: 28px;
      pointer-events: none;
      animation: flyUp 2.2s ease-out forwards;
      z-index: 60;
    }
    @keyframes flyUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-280px) scale(1.3); opacity: 0; }
    }


    .choice-votes {
      margin-top: 6px;
      font-size: 12.5px;
      font-family: 'Russo One', sans-serif;
      color: var(--blood);
      background: rgba(255,255,255,0.72);
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1.5px solid var(--ink);
    }
    .choice-btn.picked .choice-votes {
      color: #fff8eb;
      background: rgba(23,18,16,0.45);
    }

    .char-picker {
      background: #fff6df;
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 3px 3px 0px var(--ink);
    }
    .gender-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 6px;
    }
    .bond-box {
      background: #f3e4f7;
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12.8px;
      line-height: 1.32;
    }

    .trait-box {
      background: #f5ebd2;
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12.8px;
      line-height: 1.3;
    }
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 7, 0.78);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .death-modal {
      max-width: 540px;
      width: 100%;
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 12px;
      box-shadow: 10px 10px 0px var(--blood);
      padding: 20px;
      text-align: center;
      animation: popIn 0.2s ease-out;
    }
    .timer-modal {
      max-width: 440px;
      width: 100%;
      background: #212533;
      color: var(--paper);
      border: 4px solid var(--mustard);
      border-radius: 12px;
      box-shadow: 10px 10px 0px rgba(0,0,0,0.85);
      padding: 22px;
      text-align: center;
    }
    .timer-num {
      font-family: 'Russo One', sans-serif;
      font-size: 46px;
      color: var(--mustard);
      margin: 10px 0;
    }
    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--mustard);
      border: 3px solid var(--mustard);
      padding: 8px 18px;
      border-radius: 8px;
      font-family: 'Russo One', sans-serif;
      font-size: 14px;
      z-index: 200;
    }
      body.player-mode [data-act="ration"], body.admin-mode [data-act="suspect"] { display: none !important; }
  </style>
</head>
<body>
  <div class="paper-grain"></div>
  <div class="shell" id="app"></div>

  <script>
    // =========================================================================
    // 1. АТМОСФЕРНЫЙ САУНД-ДИЗАЙН НА WEB AUDIO API (БЕЗ КРИНЖА И ВНЕШНИХ ФАЙЛОВ)
    // =========================================================================
    const SoundFX = (() => {
      let ctx = null;
      let muted = false;
      let droneOsc = null;
      let droneGain = null;
      let currentMood = null;

      function ensureCtx() {
        if (muted) return null;
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      // Мягкий фоновый эмбиент Ковчега (тихий гул корпуса и глубина океана)
      function setAmbient(mood) {
        if (muted || currentMood === mood) return;
        const c = ensureCtx();
        if (!c) return;
        currentMood = mood;

        try {
          if (droneOsc) {
            droneOsc.stop();
            droneOsc.disconnect();
          }
        } catch (e) {}

        const osc = c.createOscillator();
        const filter = c.createBiquadFilter();
        const gain = c.createGain();

        osc.type = 'sine';
        osc.frequency.value = mood === 'night' ? 54 : 68;

        filter.type = 'lowpass';
        filter.frequency.value = mood === 'night' ? 110 : 145;

        gain.gain.setValueAtTime(0.001, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(mood === 'night' ? 0.032 : 0.022, c.currentTime + 1.2);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(c.destination);
        osc.start();

        droneOsc = osc;
        droneGain = gain;
      }

      function toggleMute() {
        muted = !muted;
        if (muted && droneGain && ctx) {
          droneGain.gain.setValueAtTime(0.0001, ctx.currentTime);
          currentMood = null;
        } else if (!muted) {
          setAmbient(S?.phase === 'night' ? 'night' : 'day');
          playClick();
        }
        return muted;
      }

      // Тактильный бумажно-деревянный щелчок интерфейса
      function playClick() {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.045);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.055);
      }

      // Выдача пайка / воды
      function playRation(kind) {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sine';
        if (kind === 'water') {
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.09);
        } else {
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(310, now + 0.08);
        }
        gain.gain.setValueAtTime(0.065, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      // Глухой удар печати / голосование за казнь
      function playStamp() {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(145, now);
        osc.frequency.exponentialRampToValueAtTime(48, now + 0.16);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.19);
      }

      // Наступление ночи (низкий кинематографичный саспенс-аккорд)
      function playNightFall() {
        const c = ensureCtx();
        if (!c) return;
        setAmbient('night');
        const now = c.currentTime;
        [110, 130.81, 164.81].forEach((freq, i) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.06);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.92, now + 0.9);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.045, now + 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + 1.0);
        });
      }

      // Рассвет / тревожное открытие новой серии
      function playDawn() {
        const c = ensureCtx();
        if (!c) return;
        setAmbient('day');
        const now = c.currentTime;
        [220, 277.18, 329.63].forEach((freq, i) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.001, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.045, now + i * 0.08 + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + 0.8);
        });
      }

      // Драматичный поворот / обнаружение улики
      function playTwist() {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sawtooth';
        const filter = c.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(520, now);
        filter.frequency.exponentialRampToValueAtTime(140, now + 0.45);

        osc.frequency.setValueAtTime(196, now);
        osc.frequency.exponentialRampToValueAtTime(98, now + 0.45);

        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      }

      return {
        isMuted: () => muted,
        toggleMute,
        setAmbient,
        playClick,
        playRation,
        playStamp,
        playNightFall,
        playDawn,
        playTwist
      };
    })();

    // =========================================================================
    // 2. БАЗОВЫЕ ПЕРЕМЕННЫЕ И СЕССИЯ
    // =========================================================================
    const API = '/api/kovcheg';
    const STORAGE_KEY = 'kovcheg_session_v2';

    let ses = null;
    try {
      const rawSes = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (rawSes) {
        ses = rawSes;
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    } catch (e) {}
    const urlRoom = new URLSearchParams(location.search).get('room');

    let S = null;
    let err = '';
    let selectedNightTarget = null;
    let selectedCannibalMode = 'stealth';
    let seenReactions = new Set();
    let animFrameId = null;

    function saveSes() {
      if (ses) localStorage.setItem(STORAGE_KEY, JSON.stringify(ses));
      else localStorage.removeItem(STORAGE_KEY);
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function toast(msg) {
      const d = document.createElement('div');
      d.className = 'toast';
      d.textContent = msg;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 2400);
    }

    // состояние партии (живёт во вкладке ведущего) — объявлено здесь, чтобы было видно и из опроса, и из движка
    let demoMeta = null, demoVotes = {}, demoNightActions = {}, demoSuspectedByMe = {}, demoStolenByMe = {};
    let lobbyData = null, lobbyKey = '', pulling = false, lastViewKey = '', lastReact = -1, dlEnd = 0, deadlineAt = 0, sendT = null, lastDeathId = null;
    async function call(a, b) {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ a, code: ses && ses.room, pid: ses && ses.pid, tok: ses && ses.tok, ...b }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Ошибка сервера');
      return j;
    }
    function forget() { ses = null; S = null; lobbyData = null; lastViewKey = ''; lobbyKey = ''; saveSes(); history.replaceState({}, '', location.pathname); }
    async function createRoom() {
      const title = document.getElementById('arkTitle')?.value.trim() || 'Ковчег «Надежда-7»';
      const max = Number(document.getElementById('maxPlayers')?.value), days = Number(document.getElementById('targetDays')?.value);
      try {
        const j = await call('create', { host: 'Ведущий', title, max, days });
        ses = { room: j.room.code, pid: j.me.player_id, tok: j.tok, admin: true }; saveSes(); err = '';
        lobbyData = { room: j.room, players: [j.me], me: j.me };
        history.replaceState({}, '', '?room=' + j.room.code); render();
      } catch (e) { err = e.message; render(); }
    }
    async function joinRoom() {
      const code = (document.getElementById('joinCode')?.value || '').trim().toUpperCase();
      const name = document.getElementById('joinName')?.value.trim();
      if (!/^[A-Z0-9]{5}$/.test(code) || !name) { err = 'Введите код комнаты (5 символов) и имя персонажа.'; render(); return; }
      try {
        const j = await call('join', { code, name });
        ses = { room: j.room.code, pid: j.me.player_id, tok: j.tok, admin: false }; saveSes(); err = '';
        await call('upd', { gender: chosenGender, archetype: chosenArchetype });
        history.replaceState({}, '', '?room=' + j.room.code); await poll();
      } catch (e) { err = e.message; render(); }
    }
    async function toggleReady() { try { await call('upd', { ready: !(lobbyData && lobbyData.me && lobbyData.me.is_ready) }); await poll(); } catch (e) { toast(e.message); } }
    async function saveCfg() {
      const v = id => document.getElementById(id)?.value;
      try {
        await call('cfg', { title: v('cfgTitle'), max: Number(v('cfgMax')), days: Number(v('cfgDays')),
          cfg: { cannibals: Number(v('cfgCan')), accomplice: v('cfgAcc'), supplies: v('cfgSup'), dayMin: Number(v('cfgDayMin')), bonds: v('cfgBonds') === 'on' } });
        toast('Критерии сохранены');
      } catch (e) { toast(e.message); }
      lobbyKey = ''; await poll();
    }
    async function kickPlayer(id) {

      lobbyKey = ''; await poll();
    }
    async function startGameBtn() {
      try {
        await poll();
        const ps0 = lobbyData.players.filter(p => !p.is_host);
        const notReady = ps0.filter(p => !p.is_ready).length;
        if (notReady && !confirm('Не все игроки нажали «Я готов» (' + notReady + '). Начать всё равно?')) return;
        await call('start', {});
        const ps = lobbyData.players.filter(p => !p.is_host);

      } catch (e) { toast(e.message); }
    }
    async function leaveAll() {
      if (roundTimerInterval) clearInterval(roundTimerInterval);
      roundTimerInfo = null; deathModalData = null; demoMeta = null; deadlineAt = 0;
      try { await call('leave', {}); } catch (e) {}
      forget(); render();
    }
    function onNewS() {
      if (S.death && S.death.id !== lastDeathId) { lastDeathId = S.death.id; deathModalData = S.death; }
      dlEnd = S.dlLeft != null ? Date.now() + S.dlLeft * 1000 : 0;
      const rs = S.reactions || [], mx = Math.max(0, ...rs.map(x => x.i));
      if (lastReact < 0) lastReact = mx;
      else { rs.filter(x => x.i > lastReact && x.f !== (ses && ses.pid)).forEach(x => spawnReaction(x.e)); lastReact = Math.max(lastReact, mx); }
      document.body.classList.toggle('player-mode', !S.host);
      document.body.classList.toggle('admin-mode', !!S.host);
    }
    async function poll() {
      if (!ses || !ses.room || pulling) return;
      pulling = true;
      try {
        const wantSnap = ses.admin && !demoMeta ? '&snap=1' : '';
        const r = await fetch(`${API}?code=${encodeURIComponent(ses.room)}&pid=${encodeURIComponent(ses.pid)}&tok=${encodeURIComponent(ses.tok)}${wantSnap}`);
        const j = await r.json();
        if (!r.ok) { if (r.status === 404 || r.status === 403) { forget(); err = 'Комната закрыта или недоступна.'; render(); } return; }
        lobbyData = { room: j.room, players: j.players, me: j.me };
        if (j.room.status === 'started') {
          if (ses.admin) {
            if (!demoMeta && j.snap) { try { window.restoreHostState(j.snap); toast('Партия восстановлена'); } catch (e) { console.error(e); } }
            if (demoMeta) (j.msgs || []).forEach(applyRemote);
            else if (!S) render();
          }
          else if (j.view && j.view.c) {
            const k = JSON.stringify(j.view);
            if (k !== lastViewKey) { lastViewKey = k; S = compose(j.view.c, j.view.p); onNewS(); render(); }
          } else if (!S) render();
        } else {
          const k = JSON.stringify([j.room, j.players]);
          if (k !== lobbyKey || !document.getElementById('lobbyRoot')) { lobbyKey = k; render(); }
        }
      } catch (e) {} finally { pulling = false; }
    }
    setInterval(poll, 2000);
    setInterval(() => {
      if (demoMeta && demoMeta.phase !== 'day') deadlineAt = 0;
      if (demoMeta && deadlineAt && Date.now() >= deadlineAt && !roundTimerInfo) { deadlineAt = 0; handleAct('endDay', { dataset: {} }, null); }
      const b = document.getElementById('dlBadge');
      if (b && dlEnd) { const t = Math.max(0, Math.round((dlEnd - Date.now()) / 1000)); b.textContent = '⏱ ' + Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
    }, 500);
    
    function spawnReaction(emoji) {
      const el = document.createElement('div');
      el.className = 'fly-emoji';
      el.textContent = emoji;
      el.style.right = (20 + Math.random() * 140) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }

    // =========================================================================
    // 3. ДЕТАЛИЗИРОВАННАЯ ПРОРИСОВКА КОМНАТ КОВЧЕГА И УЧАСТНИКОВ (CANVAS)
    // =========================================================================
    function startArkAnimation() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      function loop(ts) {
        drawArkCanvas(ts || 0);
        animFrameId = requestAnimationFrame(loop);
      }
      animFrameId = requestAnimationFrame(loop);
    }

    function drawArkCanvas(ts) {
      const canvas = document.getElementById('arkCanvas');
      if (!canvas || !S || !S.players) return;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cssW = canvas.clientWidth || 1000;
      const cssH = 360;
      if (canvas.width !== Math.floor(cssW * dpr) || canvas.height !== Math.floor(cssH * dpr)) {
        canvas.width = Math.floor(cssW * dpr);
        canvas.height = Math.floor(cssH * dpr);
      }

      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.scale(dpr, dpr);

      const w = cssW;
      const h = cssH;
      const isNight = S.phase === 'night';
      const t = ts * 0.002;

      // 1. Небо и грозовые облака за бортом
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
      if (isNight) {
        skyGrad.addColorStop(0, '#0a0f18');
        skyGrad.addColorStop(1, '#182436');
      } else {
        skyGrad.addColorStop(0, '#466875');
        skyGrad.addColorStop(1, '#79999e');
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      // Звёзды ночью или облака днём
      if (isNight) {
        ctx.fillStyle = 'rgba(255, 245, 210, 0.65)';
        for (let i = 0; i < 28; i++) {
          const sx = ((i * 137) % w);
          const sy = ((i * 53) % 90) + 6;
          const r = (i % 3 === 0) ? 1.6 : 1;
          ctx.beginPath();
          ctx.arc(sx, sy, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 2. Многослойные анимированные волны океана
      ctx.fillStyle = isNight ? '#0c1824' : '#264c59';
      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let x = 0; x <= w; x += 20) {
        const wy = h - 42 + Math.sin(x * 0.025 + t) * 5;
        ctx.lineTo(x, wy);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fill();

      // Лёгкая качка корпуса Ковчега на волнах
      const bobY = Math.sin(t * 0.9) * 2.2;
      ctx.save();
      ctx.translate(0, bobY);

      const pad = 18;
      const hullX = pad;
      const hullY = 14;
      const hullW = w - pad * 2;
      const hullH = h - 54;

      // Тень корпуса
      ctx.fillStyle = 'rgba(0,0,0,0.42)';
      ctx.beginPath();
      ctx.roundRect(hullX + 6, hullY + 6, hullW, hullH, 16);
      ctx.fill();

      // Внешняя стальная обшивка корпуса
      ctx.fillStyle = isNight ? '#252329' : '#cbb68c';
      ctx.beginPath();
      ctx.roundRect(hullX, hullY, hullW, hullH, 16);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#14100e';
      ctx.stroke();

      // Заклёпки по периметру корпуса
      ctx.fillStyle = isNight ? '#5c544d' : '#7a684b';
      for (let rx = hullX + 16; rx < hullX + hullW - 12; rx += 26) {
        ctx.beginPath(); ctx.arc(rx, hullY + 7, 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(rx, hullY + hullH - 7, 1.8, 0, Math.PI * 2); ctx.fill();
      }

      // 4 ДЕТАЛЬНО ПРОРИСОВАННЫЕ КОМНАТЫ / ОТСЕКА
      const rooms = [
        { key: 'bridge', title: 'I. МОСТИК И РАДИО', bgDay: '#d7cab0', bgNight: '#1d2430', accent: '#347078' },
        { key: 'galley', title: 'II. КАМБУЗ И КАЮТЫ', bgDay: '#e3cfa6', bgNight: '#29211e', accent: '#d45522' },
        { key: 'medbay', title: 'III. МЕДОТСЕК И САД', bgDay: '#cfe0cf', bgNight: '#1b2924', accent: '#5d6b3b' },
        { key: 'engine', title: 'IV. РЕАКТОР И ТРЮМ', bgDay: '#cfc4b6', bgNight: '#261e24', accent: '#e3a329' }
      ];

      const innerX = hullX + 10;
      const innerY = hullY + 14;
      const innerW = hullW - 20;
      const innerH = hullH - 26;
      const secW = innerW / 4;

      rooms.forEach((rm, i) => {
        const sx = innerX + i * secW;
        const sy = innerY;
        const sw = secW;
        const sh = innerH;

        // Фон комнаты
        ctx.fillStyle = isNight ? rm.bgNight : rm.bgDay;
        ctx.fillRect(sx, sy, sw, sh);

        // Пол с настилом
        ctx.fillStyle = isNight ? '#151317' : '#8a7353';
        ctx.fillRect(sx, sy + sh - 22, sw, 22);
        ctx.strokeStyle = '#171210';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx, sy + sh - 22);
        ctx.lineTo(sx + sw, sy + sh - 22);
        ctx.stroke();

        // Индивидуальный интерьер каждой комнаты!
        ctx.save();
        if (rm.key === 'bridge') {
          // Иллюминатор с видом на море
          ctx.fillStyle = isNight ? '#0d192b' : '#79b4c2';
          ctx.beginPath(); ctx.arc(sx + sw * 0.28, sy + 64, 18, 0, Math.PI * 2); ctx.fill();
          ctx.lineWidth = 3; ctx.strokeStyle = '#3d332a'; ctx.stroke();
          // Пульт управления и радар с бегущим лучом
          ctx.fillStyle = '#2d353b';
          ctx.fillRect(sx + sw * 0.52, sy + 52, sw * 0.36, 36);
          ctx.strokeRect(sx + sw * 0.52, sy + 52, sw * 0.36, 36);
          ctx.fillStyle = '#193b2d';
          ctx.beginPath(); ctx.arc(sx + sw * 0.7, sy + 70, 12, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#4be38a';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(sx + sw * 0.7, sy + 70);
          ctx.lineTo(sx + sw * 0.7 + Math.cos(t * 2) * 11, sy + 70 + Math.sin(t * 2) * 11);
          ctx.stroke();
        } else if (rm.key === 'galley') {
          // Подвесная тёплая лампа
          ctx.strokeStyle = '#171210';
          ctx.beginPath(); ctx.moveTo(sx + sw * 0.5, sy + 24); ctx.lineTo(sx + sw * 0.5, sy + 42); ctx.stroke();
          ctx.fillStyle = '#e3a329';
          ctx.beginPath(); ctx.arc(sx + sw * 0.5, sy + 46, 9, Math.PI, 0); ctx.fill();
          // Свет лампы
          ctx.fillStyle = isNight ? 'rgba(255, 195, 90, 0.12)' : 'rgba(255, 220, 130, 0.22)';
          ctx.beginPath();
          ctx.moveTo(sx + sw * 0.44, sy + 46);
          ctx.lineTo(sx + sw * 0.18, sy + sh - 22);
          ctx.lineTo(sx + sw * 0.82, sy + sh - 22);
          ctx.closePath();
          ctx.fill();
          // Котёл камбуза и полки с банками
          ctx.fillStyle = '#423d3a';
          ctx.fillRect(sx + sw * 0.16, sy + sh - 54, 34, 32);
          ctx.strokeRect(sx + sw * 0.16, sy + sh - 54, 34, 32);
          // Пар над котлом
          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.beginPath();
          ctx.arc(sx + sw * 0.16 + 17, sy + sh - 62 - (Math.sin(t * 2) * 3), 6, 0, Math.PI);
          ctx.stroke();
        } else if (rm.key === 'medbay') {
          // Красный крест медотсека на стене
          ctx.fillStyle = '#b82525';
          ctx.fillRect(sx + sw * 0.24 - 4, sy + 46, 8, 22);
          ctx.fillRect(sx + sw * 0.24 - 11, sy + 53, 22, 8);
          // Оранжерея: фитолампа и растения
          ctx.fillStyle = '#3e5e32';
          ctx.fillRect(sx + sw * 0.55, sy + sh - 46, sw * 0.34, 24);
          ctx.fillStyle = '#6ba349';
          for (let px = 0; px < 3; px++) {
            ctx.beginPath();
            ctx.arc(sx + sw * 0.61 + px * 16, sy + sh - 50, 9, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (rm.key === 'engine') {
          // Пульсирующий реактор и ящики с припасами
          const pulse = 0.75 + Math.sin(t * 3) * 0.25;
          ctx.fillStyle = '#333036';
          ctx.fillRect(sx + sw * 0.56, sy + 44, sw * 0.3, sh - 66);
          ctx.strokeRect(sx + sw * 0.56, sy + 44, sw * 0.3, sh - 66);
          ctx.fillStyle = isNight ? `rgba(235, 95, 45, ${pulse})` : `rgba(230, 163, 41, ${pulse})`;
          ctx.beginPath();
          ctx.arc(sx + sw * 0.71, sy + 76, 12, 0, Math.PI * 2);
          ctx.fill();
          // Ящики трюма
          ctx.fillStyle = '#9c7848';
          ctx.fillRect(sx + sw * 0.14, sy + sh - 48, 28, 26);
          ctx.strokeRect(sx + sw * 0.14, sy + sh - 48, 28, 26);
        }
        ctx.restore();

        // Переборка между отсеками с гермодверью
        if (i > 0) {
          ctx.strokeStyle = '#171210';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx, sy + sh);
          ctx.stroke();

          // Гермошлюз внизу переборки
          ctx.fillStyle = '#47423e';
          ctx.fillRect(sx - 6, sy + sh - 66, 12, 44);
          ctx.strokeRect(sx - 6, sy + sh - 66, 12, 44);
        }

        // Табличка названия отсека сверху
        ctx.fillStyle = '#171210';
        ctx.fillRect(sx + 6, sy + 4, sw - 12, 20);
        ctx.fillStyle = '#f2e5c6';
        ctx.font = '700 11px "Russo One", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(rm.title, sx + sw / 2, sy + 18);
      });

      // 3. ДЕТАЛЬНАЯ ПРОРИСОВКА УЧАСТНИКОВ (6–30 ЧЕЛОВЕК) ПО ИХ ОТСЕКАМ
      const deckToRoomIdx = {
        'Мостик': 0, 'Радиорубка': 0,
        'Камбуз': 1, 'Каюты': 1, 'Кают-компания': 1, 'VIP-каюта': 1,
        'Медотсек': 2, 'Оранжерея': 2, 'Часовня': 2,
        'Машинное': 3, 'Трюм': 3, 'Арсенал': 3, 'Холодильник': 3, 'Лаборатория': 3, 'Палуба': 0
      };

      const byRoom = [[], [], [], []];
      S.players.forEach((p, idx) => {
        const rIdx = deckToRoomIdx[p.deck] ?? (idx % 4);
        byRoom[rIdx].push({ ...p, globalIdx: idx });
      });

      const coatPalette = ['#d45522', '#347078', '#5d6b3b', '#c98a22', '#7a4463', '#435b82', '#8f5236', '#3d6e66'];
      const hairPalette = ['#1f1916', '#5c3824', '#c99b42', '#8c3b2b', '#7d7873', '#2e2927'];

      byRoom.forEach((list, rIdx) => {
        const sx = innerX + rIdx * secW;
        const count = list.length;
        list.forEach((p, localIdx) => {
          const row = Math.floor(localIdx / 4);
          const col = localIdx % 4;
          const colsInRow = Math.min(4, count - row * 4);
          const spacing = (secW - 28) / Math.max(1, colsInRow);
          const px = sx + 14 + spacing * (col + 0.5);
          const py = (row === 0) ? (innerY + innerH - 22) : (innerY + innerH - 96);

          ctx.save();
          ctx.translate(px, py);

          if (!p.alive) {
            // Силуэт выбывшего / меловой контур и табличка
            ctx.fillStyle = 'rgba(23, 18, 16, 0.25)';
            ctx.beginPath();
            ctx.ellipse(0, -4, 16, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#b82525';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-9, -24); ctx.lineTo(9, -6);
            ctx.moveTo(9, -24); ctx.lineTo(-9, -6);
            ctx.stroke();
          } else {
            // Лёгкое живое дыхание персонажа
            const breathe = Math.sin(t * 2.4 + p.globalIdx) * 1.1;
            const isRevealedCan = p.alignment === 'cannibal' && (S.phase === 'end' || S.me?.alignment === 'cannibal');
            const coat = isRevealedCan ? '#b82525' : coatPalette[p.globalIdx % coatPalette.length];
            const hair = hairPalette[p.globalIdx % hairPalette.length];
            const gType = p.gender || 'male';

            // Тень под ногами
            ctx.fillStyle = 'rgba(0,0,0,0.32)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 12, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Ноги / ботинки
            ctx.fillStyle = '#1f1b18';
            ctx.fillRect(-7, -11, 5, 11);
            ctx.fillRect(2, -11, 5, 11);

            // Туловище / китель с учётом выбранного образа
            ctx.fillStyle = coat;
            ctx.beginPath();
            if (gType === 'female') {
              ctx.roundRect(-9.5, -34 + breathe, 19, 24, 6);

            } else {
              ctx.roundRect(-12, -34 + breathe, 24, 24, 4);
            }
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#171210';
            ctx.stroke();

            // Воротник и пуговицы
            ctx.fillStyle = '#f2e5c6';
            ctx.beginPath();
            ctx.moveTo(-4, -34 + breathe);
            ctx.lineTo(0, -28 + breathe);
            ctx.lineTo(4, -34 + breathe);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#171210';
            ctx.fillRect(-1, -24 + breathe, 2, 2);
            ctx.fillRect(-1, -19 + breathe, 2, 2);

            // Голова
            ctx.fillStyle = p.hunger > 70 ? '#d9c5a7' : '#f2c89b';
            ctx.beginPath();
            ctx.arc(0, -44 + breathe, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Причёска / образ по полу
            ctx.fillStyle = hair;
            ctx.beginPath();
            if (gType === 'female') {
              ctx.arc(0, -46 + breathe, 10.8, Math.PI * 0.85, Math.PI * 2.15);
              ctx.fillRect(-10.5, -46 + breathe, 4, 14);
              ctx.fillRect(6.5, -46 + breathe, 4, 14);

            } else {
              ctx.arc(0, -47 + breathe, 10.2, Math.PI, 0);
            }
            ctx.fill();

            // Выразительные глаза и брови (реагируют на голод / ночь / страх)
            ctx.fillStyle = '#171210';
            ctx.beginPath();
            ctx.arc(-3.5, -44 + breathe, 1.5, 0, Math.PI * 2);
            ctx.arc(3.5, -44 + breathe, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Брови
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            if (isRevealedCan || p.hunger > 65 || isNight) {
              ctx.moveTo(-6, -48 + breathe); ctx.lineTo(-2, -46.5 + breathe);
              ctx.moveTo(6, -48 + breathe); ctx.lineTo(2, -46.5 + breathe);
            } else {
              ctx.moveTo(-6, -47 + breathe); ctx.lineTo(-2, -47.5 + breathe);
              ctx.moveTo(6, -47 + breathe); ctx.lineTo(2, -47.5 + breathe);
            }
            ctx.stroke();

            // Индикатор пайка над головой днём
            if (S.phase === 'day' && (p.ration?.food || p.ration?.water)) {
              ctx.fillStyle = '#171210';
              ctx.fillRect(-12, -66, 24, 11);
              ctx.fillStyle = '#e3a329';
              ctx.font = '700 9px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText((p.ration.food ? '🍲' : '') + (p.ration.water ? '💧' : ''), 0, -57);
            }

            // Метка «ВЫ» для самого игрока
            if (p.id === S.me?.id) {
              ctx.fillStyle = '#e3a329';
              ctx.strokeStyle = '#171210';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(0, -57 + breathe);
              ctx.lineTo(-5, -64 + breathe);
              ctx.lineTo(5, -64 + breathe);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
          }

          // Плашка с именем под персонажем
          const label = p.name.replace(/^Вы \(|\)$/g, '').slice(0, 10);
          ctx.fillStyle = p.alive ? 'rgba(23, 18, 16, 0.84)' : 'rgba(90, 82, 74, 0.75)';
          ctx.beginPath();
          ctx.roundRect(-26, 2, 52, 13, 3);
          ctx.fill();

          ctx.fillStyle = p.alive ? '#fbf3e2' : '#d6cfc2';
          ctx.font = '700 10px "PT Sans Narrow", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(label, 0, 11.5);

          ctx.restore();
        });
      });

      ctx.restore(); // конец качки корпуса
      ctx.restore(); // конец dpr
    }

    // 4. ЭКРАНЫ ИНТЕРФЕЙСА, ВЫБОР ПЕРСОНАЖА, ТАЙМЕР И МИНИ-ЭКРАН СМЕРТИ

    function startRoundTimer(label, seconds, onDone) {
      if (roundTimerInterval) clearInterval(roundTimerInterval);
      roundTimerInfo = { label, secondsLeft: seconds, onDone };
      render();
      publishSoon();
      roundTimerInterval = setInterval(() => {
        if (!roundTimerInfo) {
          clearInterval(roundTimerInterval);
          return;
        }
        roundTimerInfo.secondsLeft -= 1;
        if (roundTimerInfo.secondsLeft <= 0) {
          const cb = roundTimerInfo.onDone;
          clearInterval(roundTimerInterval);
          roundTimerInfo = null;
          if (typeof cb === 'function') cb();
          else render();
        } else {
          render();
        }
      }, 1000);
    }

    function skipRoundTimer() {
      if (!roundTimerInfo) return;
      const cb = roundTimerInfo.onDone;
      clearInterval(roundTimerInterval);
      roundTimerInfo = null;
      SoundFX.playClick();
      if (typeof cb === 'function') cb();
      else render();
    }
